plugins { id 'com.android.application' }

android {
    namespace 'com.nemerpus.cesta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nemerpus.cesta'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    // La interfaz web vive en ../web y se empaqueta tal cual como assets.
    sourceSets {
        main { assets.srcDirs = ['../web'] }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
